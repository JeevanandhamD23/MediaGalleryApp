version: '3.8'

services:
  client:
    build:
      context: ./src
      dockerfile: Dockerfile
    ports:
      - '3000:80'
    depends_on:
      - server
    environment:
      - REACT_APP_API_URL=http://localhost:5000

  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    ports:
      - '5000:5000'
    depends_on:
      - mongo
    environment:
      - MONGO_URI=mongodb://mongo:27017/mediaapp
      - PORT=5000
      - NODE_ENV=production
      - FRONTEND_URL=http://localhost:3000
    volumes:
      - uploads:/app/uploads

  mongo:
    image: mongo:latest
    ports:
      - '27017:27017'
    volumes:
      - mongodb_data:/data/db

volumes:
  mongodb_data:
  uploads:
